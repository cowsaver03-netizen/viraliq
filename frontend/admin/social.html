<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Media - Admin Panel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/variables.css">
        <link rel="stylesheet" href="css/base.css">
        <link rel="stylesheet" href="css/modules/social.css">
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="logo"><i class="fas fa-rocket"></i><span>Admin Panel</span></div>
            <button class="sidebar-toggle" id="sidebarToggle"><i class="fas fa-bars"></i></button>
        </div>
        <nav class="sidebar-nav"><ul>
            <li class="nav-item"><a href="dashboard.html" class="nav-link"><i class="fas fa-chart-line"></i><span>Dashboard</span></a></li>
            <li class="nav-item"><a href="pricing.html" class="nav-link"><i class="fas fa-tags"></i><span>Pricing Plans</span></a></li>
            <li class="nav-item"><a href="blog.html" class="nav-link"><i class="fas fa-newspaper"></i><span>Blog Management</span></a></li>
            <li class="nav-item"><a href="team.html" class="nav-link"><i class="fas fa-users"></i><span>Team Members</span></a></li>
            <li class="nav-item"><a href="testimonials.html" class="nav-link"><i class="fas fa-star"></i><span>Testimonials</span></a></li>
            <li class="nav-item"><a href="customers.html" class="nav-link"><i class="fas fa-users-circle"></i><span>Customer Portal</span></a></li>
            <li class="nav-item"><a href="contact.html" class="nav-link"><i class="fas fa-envelope"></i><span>Contact Inquiries</span></a></li>
            <li class="nav-item"><a href="newsletter.html" class="nav-link"><i class="fas fa-paper-plane"></i><span>Newsletter</span></a></li>
            <li class="nav-item active"><a href="social.html" class="nav-link"><i class="fas fa-share-nodes"></i><span>Social Media</span></a></li>
            <li class="nav-item"><a href="links.html" class="nav-link"><i class="fas fa-link"></i><span>Pricing Links</span></a></li>
            <li class="nav-item"><a href="whatsapp.html" class="nav-link"><i class="fab fa-whatsapp"></i><span>WhatsApp Config</span></a></li>
        </ul></nav>
    </aside>

    <main class="main-content">
        <header class="top-navbar">
            <div class="navbar-left">
                <button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></button>
                <h1 class="page-title">Social Media Links</h1>
            </div>
            <div class="navbar-right">
                <div class="user-menu">
                   
                    <button class="logout-btn" onclick="window.location.href='../'"><i class="fas fa-sign-out-alt"></i></button>
                </div>
            </div>
        </header>

        <div class="content">
            <div class="module-header">
                <h2>Social Media Links</h2>
            </div>

            <div class="card">
                <form id="socialForm">
                    <div class="form-group">
                        <label for="instagram"><i class="fab fa-instagram"></i> Instagram URL</label>
                        <input type="url" id="instagram" placeholder="https://instagram.com/yourprofile">
                    </div>

                    <div class="form-group">
                        <label for="facebook"><i class="fab fa-facebook"></i> Facebook URL</label>
                        <input type="url" id="facebook" placeholder="https://facebook.com/yourpage">
                    </div>

                    <div class="form-group">
                        <label for="twitter"><i class="fab fa-twitter"></i> Twitter (X) URL</label>
                        <input type="url" id="twitter" placeholder="https://twitter.com/yourhandle">
                    </div>

                    <div class="form-group">
                        <label for="whatsapp"><i class="fab fa-whatsapp"></i> WhatsApp Number</label>
                        <input type="tel" id="whatsapp" placeholder="+91 98765 43210">
                    </div>

                    <button type="button" class="btn btn-primary" onclick="saveSocialLinks()">
                        <i class="fas fa-save"></i> Save Changes
                    </button>
                </form>
            </div>
        </div>
    </main>

    <div class="toast-container" id="toastContainer"></div>
    <script src="js/modules/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/notifications.js"></script>
    <!-- <script src="js/storage.js"></script> -->
    <script src="js/components.js"></script>
    <!-- <script src="js/app.js"></script> -->
    <script src="js/modules/social.js"></script>
    
</body>
</html>
